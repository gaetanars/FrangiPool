substitutions:
  local_temp_address: "0x0000000000000000"  # Remplacer par l'adresse de votre sonde locale (voir logs ESPHome au démarrage)
  temp_address: "0x0000000000000000"  # Remplacer par l'adresse de votre sonde canalisation
  preset_slug: "ep"

esphome:
  project:
    name: frangipool.ep
    version: "0.2.0"

dashboard_import:
  package_import_url: github://gaetanars/FrangiPool/frangipool-ep.yaml@main

packages:
  base: !include packages/base.yaml
  filtration: !include packages/filtration.yaml
  i2c_ads1115: !include packages/i2c_ads1115.yaml
  electrolyser: !include packages/electrolyser.yaml
  ph: !include packages/ph.yaml
