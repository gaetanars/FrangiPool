globals:
  - id: g_store_pool_redox
    type: float
    restore_value: true
  - id: g_redox_offset
    type: float
    restore_value: true
  - id: g_redox_manual_offset
    type: float
    restore_value: true

sensor:
  - platform: ads1115
    name: "ADS1115 Channel A0-GND"
    id: ads1115_a0
    unit_of_measurement: "mV"
    device_class: "voltage"
    state_class: "measurement"
    entity_category: diagnostic
    multiplexer: 'A0_GND'
    gain: 6.144
    update_interval: 10s
    filters:
      - multiply: 1000

  - platform: template
    name: Redox Temps Réel
    unit_of_measurement: "mV"
    device_class: "voltage"
    state_class: "measurement"
    icon: mdi:chemical-weapon
    entity_category: diagnostic
    id: realtime_redox
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float manual = id(g_redox_manual_offset);
      if (manual != 0.0f) return ((2500-id(ads1115_a0).state)/1.037) + manual;
      else return ((2500-id(ads1115_a0).state)/1.037) + id(g_redox_offset);

  - platform: template
    name: Redox
    unit_of_measurement: "mV"
    device_class: "voltage"
    state_class: "measurement"
    icon: mdi:chemical-weapon
    id: pool_redox
    accuracy_decimals: 0
    lambda: return id(g_store_pool_redox);

  - platform: template
    name: Redox Offset
    entity_category: diagnostic
    id: redox_offset_sensor
    lambda: |-
      float manual = id(g_redox_manual_offset);
      return (manual != 0.0f) ? manual : id(g_redox_offset);

button:
  - platform: template
    name: Redox Calibration 225mV
    entity_category: config
    on_press:
      then:
        - globals.set:
            id: g_redox_manual_offset
            value: '0.0'
        - delay: 180s
        - globals.set:
            id: g_redox_offset
            value: !lambda "return 225 - (((2500-id(ads1115_a0).state)/1.037));"
        - component.update: redox_offset_sensor
        - component.update: realtime_redox
        - homeassistant.action:
            action: persistent_notification.create
            data:
              title: Message from FrangiPool
            data_template:
              message: Calibration Redox à 225mV terminée !

  - platform: template
    name: Redox Calibration 475mV
    entity_category: config
    on_press:
      then:
        - globals.set:
            id: g_redox_manual_offset
            value: '0.0'
        - delay: 180s
        - globals.set:
            id: g_redox_offset
            value: !lambda "return 475 - (((2500-id(ads1115_a0).state)/1.037));"
        - component.update: redox_offset_sensor
        - component.update: realtime_redox
        - homeassistant.action:
            action: persistent_notification.create
            data:
              title: Message from FrangiPool
            data_template:
              message: Calibration Redox à 475mV terminée !

  - platform: template
    name: Redox Calibration Reset
    entity_category: config
    on_press:
      then:
        - globals.set:
            id: g_redox_offset
            value: '0.0'
        - component.update: redox_offset_sensor
        - component.update: realtime_redox

interval:
  - interval: 1min
    then:
      - if:
          condition:
            and:
              - switch.is_on: pump
              - lambda: "return id(pump_uptime).state >= id(pump_uptime_delay).state;"
          then:
            - globals.set:
                id: g_store_pool_redox
                value: !lambda |-
                  float v = id(realtime_redox).state;
                  if (std::isnan(v)) return id(g_store_pool_redox);
                  float prev = id(g_store_pool_redox);
                  if (std::isnan(prev)) return v;
                  return prev * 0.8f + v * 0.2f;

api:
  actions:
    # set_redox_manual_offset(offset: float)
    #   Correction manuelle du Redox en mV (plage conseillée : -300..300).
    #   Remplace l'ancienne entité number supprimée — à utiliser depuis
    #   HA Developer Tools → Actions ou une automatisation HA.
    #   Si offset = 0 : désactive le manuel, l'offset de calibration (225/475 mV) reprend la main.
    #   Persiste dans la NVS : survit aux reboots, mais PAS à un changement d'ESP (re-appliquer).
    #
    #   Exemple — HA Developer Tools → Actions :
    #     action: esphome.frangipool_set_redox_manual_offset
    #     data:
    #       offset: 45
    - action: set_redox_manual_offset
      variables:
        offset: float
      then:
        - globals.set:
            id: g_redox_manual_offset
            value: !lambda "return offset;"
        - component.update: redox_offset_sensor
        - component.update: realtime_redox
