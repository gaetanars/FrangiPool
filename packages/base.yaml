substitutions:
  preset_slug: "erp"  # Overridden by each preset — used to build the OTA manifest URL

esphome:
  name: frangipool
  name_add_mac_suffix: true
  friendly_name: FrangiPool
  min_version: 2024.6.0

wifi:
  ap:

improv_serial:

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  actions:
    - action: swap_dallas_probes
      then:
        - globals.set:
            id: g_dallas_swapped
            value: !lambda 'return !id(g_dallas_swapped);'

ota:
  - platform: http_request

captive_portal:

http_request:
  useragent: esphome/frangipool
  timeout: 10s

update:
  - platform: http_request
    name: "Mise à jour FrangiPool"
    source: "https://gaetanars.github.io/FrangiPool/install/${preset_slug}/manifest.json"
    entity_category: config

time:
  - platform: homeassistant
    id: esptime
    timezone: Europe/Paris

one_wire:
  - platform: gpio
    pin: GPIO23

globals:
  - id: g_pump_last_turn_on
    type: int
    restore_value: True
  - id: g_store_pool_temp
    type: float
    restore_value: True
  - id: g_dallas_swapped
    type: bool
    restore_value: true
    initial_value: 'false'

number:
  - platform: template
    name: Consigne Antigel
    id: max_antifreeze_temp
    optimistic: True
    unit_of_measurement: °C
    device_class: temperature
    step: 0.2
    min_value: -2.0
    max_value: 2.0
    restore_value: True
    initial_value: 0.0
    entity_category: config

  - platform: template
    name: Délais mesures (au lancement de la filtration)
    id: pump_uptime_delay
    optimistic: True
    unit_of_measurement: min
    step: 5
    min_value: 5
    max_value: 30
    restore_value: True
    initial_value: 20
    entity_category: config

sensor:
  - platform: dallas_temp
    index: 0
    id: dallas_raw_0
    internal: true
    update_interval: 10s

  - platform: dallas_temp
    index: 1
    id: dallas_raw_1
    internal: true
    update_interval: 10s

  - platform: template
    name: Température Local
    id: local_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 18
          send_every: 6
          send_first_at: 6
    lambda: |-
      return id(g_dallas_swapped) ? id(dallas_raw_1).state : id(dallas_raw_0).state;

  - platform: template
    name: Température Canalisation
    id: pipe_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 18
          send_every: 6
          send_first_at: 6
    lambda: |-
      return id(g_dallas_swapped) ? id(dallas_raw_0).state : id(dallas_raw_1).state;

  - platform: template
    id: pipe_temp_raw
    internal: true
    unit_of_measurement: "°C"
    update_interval: 10s
    lambda: |-
      return id(g_dallas_swapped) ? id(dallas_raw_0).state : id(dallas_raw_1).state;

  - platform: template
    name: Température Piscine
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    id: pool_temp
    accuracy_decimals: 1
    lambda: |-
      return id(g_store_pool_temp);

  - platform: template
    name: Pump Uptime
    id: pump_uptime
    internal: true
    unit_of_measurement: "min"
    lambda: |-
      // Premier flash : g_pump_last_turn_on vaut 0 (C++ zero-init), ce qui ferait passer
      // la garde des 20 min dès le boot. On reporte 0 tant que la pompe n'a jamais été
      // réellement allumée — le handler on_turn_on du switch écrit un vrai timestamp au
      // premier démarrage.
      if (!id(pump).state) return 0.0;
      if (id(g_pump_last_turn_on) <= 0) return 0.0;
      return (id(esptime).now().timestamp - id(g_pump_last_turn_on)) / 60.0;

  - platform: uptime
    name: Uptime
    unit_of_measurement: s
    entity_category: diagnostic

  - platform: wifi_signal
    name: RSSI
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: Antigel
    device_class: cold
    id: antifreeze
    icon: mdi:snowflake-alert
    lambda: |-
      static bool state = false;

      float t = id(pipe_temp_raw).state;
      // Capteur Dallas injoignable : préserver l'état précédent plutôt que laisser NaN verrouiller OFF.
      if (std::isnan(t)) return state;
      float on_threshold  = id(max_antifreeze_temp).state - 1.0;
      float off_threshold = id(max_antifreeze_temp).state;

      if (!state && t < on_threshold) {
        state = true;
      } else if (state && t >= off_threshold) {
        state = false;
      }

      return state;
    filters:
      - delayed_on: 120s
      - delayed_off: 300s
    on_press:
      then:
        - homeassistant.action:
            action: persistent_notification.create
            data:
              title: Message from FrangiPool
            data_template:
              message: >-
                Mode hors-gel actif.
                Température canalisation : {{ states('sensor.temperature_canalisation') }} °C
    on_release:
      then:
        - homeassistant.action:
            action: persistent_notification.create
            data:
              title: Message from FrangiPool
            data_template:
              message: >-
                Fin du mode hors-gel.
                Température canalisation : {{ states('sensor.temperature_canalisation') }} °C

  - platform: status
    name: Status
    entity_category: diagnostic

switch:
  # Scheduler-owned: authoritative writer is packages/filtration.yaml (interval 30s).
  - platform: gpio
    pin:
      number: GPIO25
      inverted: true
    name: Filtration
    id: pump
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:engine
    on_turn_on:
      then:
        - globals.set:
            id: g_pump_last_turn_on
            value: !lambda "return id(esptime).now().timestamp;"

button:
  - platform: restart
    name: Reboot

status_led:
  pin:
    number: GPIO2
    inverted: yes

interval:
  - interval: 1min
    then:
      - if:
          condition:
            and:
              - switch.is_on: pump
              - lambda: "return id(pump_uptime).state >= id(pump_uptime_delay).state;"
          then:
            - globals.set:
                id: g_store_pool_temp
                value: !lambda "return id(pipe_temp).state;"
