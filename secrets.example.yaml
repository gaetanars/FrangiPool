# secrets.example.yaml — FrangiPool
#
# Ce fichier n'est plus nécessaire pour le flash initial ni pour la distribution.
# Il sert uniquement de référence pour les cas avancés (self-compilers).
#
# Flux recommandé (zéro secrets.yaml) :
#   1. Flash du binaire pré-compilé via ESPHome Web (web.esphome.io, USB + Chrome/Edge)
#      → improv_serial propose de configurer le WiFi directement dans le navigateur
#   2. Si pas d'ESPHome Web : connectez-vous à l'AP "frangipool-XXXX" (ouvert)
#      puis ouvrez http://192.168.4.1 pour configurer le WiFi via le captive portal
#   3. ESPHome Dashboard découvre le device sur le réseau → "Adopt"
#      → génère et pousse automatiquement api_encryption_key + ota_password uniques
#
# Self-compilers (compilation locale depuis les sources) :
#   Si vous compilez vous-même et souhaitez pré-configurer le WiFi, ajoutez
#   wifi_ssid et wifi_password directement dans les substitutions de votre preset :
#
#     substitutions:
#       name: frangipool
#       friendly_name: FrangiPool
#       wifi_ssid: "MonReseauWifi"
#       wifi_password: "MonMotDePasse"
#
#   Pour ajouter l'encryption API et le mot de passe OTA après adoption, ajoutez
#   ces blocs dans votre preset local (ils prennent priorité sur les packages) :
#
#     api:
#       encryption:
#         key: "votre-cle-32-bytes-base64"  # openssl rand -base64 32
#
#     ota:
#       - platform: esphome
#         password: "votre-ota-password"
#
# Adresses des sondes Dallas (toujours nécessaires — adresses matérielles physiques) :
#   Flashez sans les configurer, ouvrez les logs ESPHome au démarrage :
#   le scan 1-Wire affiche les adresses découvertes.
#   Substituez-les dans le bloc substitutions: du preset.
