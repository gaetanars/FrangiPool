name: Release firmware

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# contents: write requis pour (a) release-action, (b) auto-commit du CHANGELOG.
permissions:
  contents: write

# Concurrency group partagé avec release-pcb.yml — sérialise tout accès à `main`
# en cas de push simultané `git push origin main v0.2.0 pcb-0.1.1`, éliminant
# toute fenêtre de race sur l'auto-commit du CHANGELOG.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prev_tag: ${{ steps.prev.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag commit is on origin/main
        run: |
          git fetch origin main --quiet
          if ! git branch -r --contains "${{ github.sha }}" --format='%(refname)' | grep -Fxq 'refs/remotes/origin/main'; then
            echo "::error::Tag ${{ github.ref_name }} points to a commit absent from origin/main. Refusing to release."
            exit 1
          fi

      - name: Fail fast if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ github.ref_name }} already exists. Delete it explicitly (gh release delete ${{ github.ref_name }} --yes) before retagging."
            exit 1
          fi

      - name: Compute previous firmware tag
        id: prev
        run: |
          prev_tag=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -Fx "${{ github.ref_name }}" | head -n1)
          if [ -z "$prev_tag" ]; then
            echo "::error::No previous firmware tag found (format x.y.z). Push a baseline firmware tag first."
            exit 1
          fi
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          echo "- Previous firmware tag: $prev_tag" >> "$GITHUB_STEP_SUMMARY"

  compile:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        preset:
          - frangipool-e
          - frangipool-er
          - frangipool-ep
          - frangipool-erp
          - frangipool-be
          - frangipool-ber
          - frangipool-bep
          - frangipool-berp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Patch version
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/version: dev/version: ${VERSION}/" ${{ matrix.preset }}.yaml

      - name: Build ${{ matrix.preset }}
        id: esphome-build
        uses: esphome/build-action@4ef4722a2935eac47b7e227fe0e1f8e0f8afcc42  # v7.3.0
        with:
          yaml-file: ${{ matrix.preset }}.yaml
          version: "2026.4.1"

      - name: Collect firmware binaries
        run: |
          VERSION="${{ github.ref_name }}"
          PRESET="${{ matrix.preset }}"
          BUILD_DIR=".esphome/build/frangipool/.pioenvs/frangipool"
          mkdir -p firmware
          cp "${BUILD_DIR}/firmware.factory.bin" "firmware/${PRESET}-v${VERSION}.factory.bin"
          cp "${BUILD_DIR}/firmware.ota.bin"     "firmware/${PRESET}-v${VERSION}.ota.bin"
          echo "- Built ${PRESET}-v${VERSION}.factory.bin + .ota.bin" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firmware-${{ matrix.preset }}
          path: firmware/
          retention-days: 1

  release:
    needs: [preflight, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all firmware binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: firmware-*
          path: firmware/
          merge-multiple: true

      - name: List collected binaries
        run: ls -lh firmware/ >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes + update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1  # v1.10.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fromTag: ${{ github.ref_name }}
          toTag: ${{ needs.preflight.outputs.prev_tag }}
          changelogFilePath: CHANGELOG.md
          excludeTypes: chore,style,build
          excludeScopes: changelog,pcb

      - name: Compose release body
        id: release_notes
        env:
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changes }}
        run: |
          delimiter="BODY_$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            printf '%s\n' "$CHANGELOG_BODY"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "- Composed release body for ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CHANGELOG.md update
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          branch: main
          commit_message: 'docs(changelog): update CHANGELOG.md for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md

      - name: Log CHANGELOG commit to step summary
        run: echo "- CHANGELOG committed to main for ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release (draft)
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          allowUpdates: true
          makeLatest: legacy
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      - name: Upload firmware binaries to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" firmware/*.bin \
            --repo "${{ github.repository }}"
          BIN_COUNT=$(ls firmware/*.bin 2>/dev/null | wc -l)
          echo "- Uploaded ${BIN_COUNT} firmware binaries to draft ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false \
            --repo "${{ github.repository }}"
          echo "- GitHub Release ${{ github.ref_name }} published" >> "$GITHUB_STEP_SUMMARY"
