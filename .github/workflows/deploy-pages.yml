name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Release firmware"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à déployer (ex: 0.3.0). Laisser vide pour utiliser le dernier release.'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve target version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          else
            VERSION=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "- Deploying manifests for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download web installer assets for all presets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for SLUG in e er ep erp be ber bep berp; do
            DIR="docs/install/${SLUG}"
            TMP="/tmp/pages-${SLUG}"
            mkdir -p "${DIR}" "${TMP}"

            # Download all pages assets for this preset (slug-prefixed in the release)
            gh release download "$VERSION" \
              --repo "${{ github.repository }}" \
              --pattern "pages-${SLUG}-*" \
              --dir "${TMP}"

            # Strip the "pages-${SLUG}-" prefix to restore original filenames so
            # the manifest.json relative paths produced by esphome/build-action
            # resolve correctly when served from Pages
            for f in "${TMP}/pages-${SLUG}-"*; do
              fname="${f#${TMP}/pages-${SLUG}-}"
              cp "$f" "${DIR}/${fname}"
            done

            echo "- Prepared web installer assets for frangipool-${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Log deployment URL
        run: |
          echo "- Pages deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
