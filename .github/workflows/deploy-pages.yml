name: Deploy GitHub Pages

on:
  # Déploiement automatique après une release firmware réussie
  workflow_run:
    workflows: ["Release firmware"]
    types: [completed]

  # Déploiement manuel ou correction de doc seule (push sur main)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version firmware à déployer (ex: 0.5.0). Laisser vide pour la dernière release.'
        required: false

  # Corrections de documentation sans release firmware
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/static/install/**'  # exclut les assets firmware (non trackés en git)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Ne pas déployer si workflow_run a échoué
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve target firmware version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(gh release list \
              --repo "${{ github.repository }}" \
              --limit 10 \
              --json tagName \
              --jq '[.[] | select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first | .tagName')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "- Deploying firmware manifests for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download firmware assets for all presets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for SLUG in e er ep erp be ber bep berp; do
            DIR="docs/static/install/${SLUG}"
            TMP="/tmp/pages-${SLUG}"
            mkdir -p "${DIR}" "${TMP}"

            gh release download "$VERSION" \
              --repo "${{ github.repository }}" \
              --pattern "pages-${SLUG}-*" \
              --dir "${TMP}"

            # Strip the "pages-${SLUG}-" prefix to restore original filenames
            for f in "${TMP}/pages-${SLUG}-"*; do
              fname="${f#${TMP}/pages-${SLUG}-}"
              cp "$f" "${DIR}/${fname}"
            done

            echo "- Prepared install assets for frangipool-${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Docusaurus dependencies
        working-directory: docs
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Log deployment URL
        run: |
          echo "- Pages deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
