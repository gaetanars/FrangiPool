name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Release firmware"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à déployer (ex: 0.3.0). Laisser vide pour utiliser le dernier release.'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Resolve target version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
          else
            VERSION=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "- Deploying manifests for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download firmware binaries for all presets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for SLUG in e er ep erp be ber bep berp; do
            DIR="docs/install/${SLUG}"
            mkdir -p "${DIR}"
            gh release download "$VERSION" \
              --repo "${{ github.repository }}" \
              --pattern "frangipool-${SLUG}-*.factory.bin" \
              --dir "${DIR}"
            echo "- Downloaded frangipool-${SLUG} factory binary" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate manifests for all presets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          SEMVER="${VERSION}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          declare -A PRESET_LABELS=(
            ["e"]="Électrolyseur"
            ["er"]="Électrolyseur + Redox"
            ["ep"]="Électrolyseur + pH"
            ["erp"]="Électrolyseur + Redox + pH"
            ["be"]="Booster + Électrolyseur"
            ["ber"]="Booster + Électrolyseur + Redox"
            ["bep"]="Booster + Électrolyseur + pH"
            ["berp"]="Booster + Électrolyseur + Redox + pH"
          )

          for SLUG in e er ep erp be ber bep berp; do
            PRESET="frangipool-${SLUG}"
            LABEL="${PRESET_LABELS[$SLUG]}"
            DIR="docs/install/${SLUG}"

            # `parts.path` est relatif → servi par Pages (même origine, pas de CORS).
            # `ota.path` est absolu → téléchargé par l'ESP lui-même, sans contrainte CORS navigateur.
            cat > "${DIR}/manifest.json" <<JSON
          {
            "name": "FrangiPool — ${LABEL}",
            "version": "${SEMVER}",
            "home_assistant_domain": "esphome",
            "new_install_prompt_erase": false,
            "funding_url": "https://github.com/gaetanars/FrangiPool",
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  {
                    "path": "${PRESET}-v${SEMVER}.factory.bin",
                    "offset": 0
                  }
                ],
                "ota": {
                  "path": "${BASE_URL}/${PRESET}-v${SEMVER}.ota.bin"
                }
              }
            ]
          }
          JSON
            echo "- Generated manifest for ${PRESET} → ${DIR}/manifest.json" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log deployment URL
        run: |
          echo "- Pages deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
