name: Build

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build firmware (berp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build frangipool-berp
        uses: esphome/build-action@4ef4722a2935eac47b7e227fe0e1f8e0f8afcc42  # v7.3.0
        with:
          yaml-file: frangipool-berp.yaml
          version: "2026.5.1"
