name: Build

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build firmware (berp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get ESPHome version from requirements
        id: get_esphome_version
        run: |
          VERSION=$(grep -i '^esphome==' requirements.txt | awk -F '==' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build frangipool-berp
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667  # v8.1.0
        with:
          yaml-file: frangipool-berp.yaml
          version: ${{ steps.get_esphome_version.outputs.version }}
