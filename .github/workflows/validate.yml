name: Validate ESPHome configs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'

# Token minimal : validation ESPHome a seulement besoin de lire le repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - frangipool-e.yaml
          - frangipool-er.yaml
          - frangipool-ep.yaml
          - frangipool-erp.yaml
          - frangipool-be.yaml
          - frangipool-ber.yaml
          - frangipool-bep.yaml
          - frangipool-berp.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install ESPHome
        run: pip install "esphome==2026.3.3"  # pin to tested version — update when upgrading locally

      - name: Validate ${{ matrix.config }}
        run: esphome config ${{ matrix.config }}
