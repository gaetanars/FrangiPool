name: Validate ESPHome configs

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'pcb/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'

# Token minimal : validation ESPHome a seulement besoin de lire le repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - frangipool-e.yaml
          - frangipool-er.yaml
          - frangipool-ep.yaml
          - frangipool-erp.yaml
          - frangipool-be.yaml
          - frangipool-ber.yaml
          - frangipool-bep.yaml
          - frangipool-berp.yaml
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Validate ${{ matrix.config }}
        run: esphome config ${{ matrix.config }}
